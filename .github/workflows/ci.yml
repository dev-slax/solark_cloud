name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp
      - name: Compile Python
        run: python -m compileall -q __init__.py api.py config_flow.py const.py sensor.py tests
      - name: Validate JSON
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool strings.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          python -m json.tool translations/en.json >/dev/null
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
